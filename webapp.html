<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirill-Lotin AI Translater 🤖</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #8B5CF6;
            --secondary: #EC4899;
            --dark: #1F2937;
            --light: #F9FAFB;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .header::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none"><path fill="rgba(255,255,255,0.1)" d="M0,0 L100,0 L100,100 Z"></path></svg>');
            background-size: 100% 100%;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }
        
        .subtitle {
            opacity: 0.9;
            font-size: 1.1em;
            position: relative;
            z-index: 1;
        }
        
        .content {
            padding: 30px;
        }
        
        .textarea-container {
            position: relative;
            margin-bottom: 25px;
        }
        
        textarea {
            width: 100%;
            min-height: 150px;
            padding: 20px;
            border: 2px solid #E5E7EB;
            border-radius: 16px;
            font-size: 18px;
            resize: vertical;
            transition: all 0.3s;
        }
        
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1);
        }
        
        .button-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        
        button {
            padding: 18px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            color: white;
        }
        
        .btn-secondary {
            background: #F3F4F6;
            color: var(--dark);
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.4);
        }
        
        .result-box {
            background: #F9FAFB;
            border-radius: 16px;
            padding: 25px;
            margin-top: 30px;
            border: 2px dashed #D1D5DB;
            position: relative;
        }
        
        .result-text {
            font-size: 18px;
            line-height: 1.6;
            min-height: 100px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .copy-btn {
            background: var(--primary);
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
            transition: all 0.3s;
        }
        
        .copy-btn:hover {
            background: #7C3AED;
            transform: translateY(-2px);
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 30px;
        }
        
        .stat-box {
            background: #F3F4F6;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: var(--primary);
        }
        
        .stat-label {
            color: #6B7280;
            font-size: 0.9em;
            margin-top: 5px;
        }
        
        @media (max-width: 600px) {
            .button-group {
                grid-template-columns: 1fr;
            }
            
            .stats {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 2em;
            }
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .history {
            margin-top: 30px;
            background: #F9FAFB;
            border-radius: 16px;
            padding: 20px;
        }
        
        .history-item {
            background: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            border-left: 4px solid var(--primary);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-robot"></i> Kirill-Lotin AI Translater</h1>
            <p class="subtitle">Eng tezkor va aniq konvertatsiya platformasi</p>
        </div>
        
        <div class="content">
            <div class="textarea-container">
                <textarea id="inputText" placeholder="Matnni kiriting yoki yopishtiring..."></textarea>
            </div>
            
            <div class="button-group">
                <button class="btn-primary pulse" onclick="convertToCyrillic()">
                    <i class="fas fa-arrow-right"></i> Lotin → Kirill
                </button>
                <button class="btn-secondary" onclick="convertToLatin()">
                    <i class="fas fa-arrow-left"></i> Kirill → Lotin
                </button>
            </div>
            
            <div class="result-box">
                <h3><i class="fas fa-clipboard-check"></i> Natija:</h3>
                <div class="result-text" id="result">
                    Bu yerda natija ko'rinadi...
                </div>
                <button class="copy-btn" onclick="copyToClipboard()">
                    <i class="far fa-copy"></i> Natijani nusxalash
                </button>
            </div>
            
            <div class="stats">
                <div class="stat-box">
                    <div class="stat-number" id="charCount">0</div>
                    <div class="stat-label">Belgilar</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="conversionCount">0</div>
                    <div class="stat-label">Konvertatsiya</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="timeSaved">0</div>
                    <div class="stat-label">Saqlandi (sek)</div>
                </div>
            </div>
            
            <div class="history">
                <h3><i class="fas fa-history"></i> Oxirgi konvertatsiyalar:</h3>
                <div id="historyList">
                    <!-- Tarix bu yerda ko'rinadi -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Conversion dictionaries
        const latinToCyrillic = {
            'a': 'а', 'A': 'А', 'b': 'б', 'B': 'Б', 'd': 'д', 'D': 'Д',
            'e': 'е', 'E': 'Е', 'f': 'ф', 'F': 'Ф', 'g': 'г', 'G': 'Г',
            'h': 'ҳ', 'H': 'Ҳ', 'i': 'и', 'I': 'И', 'j': 'ж', 'J': 'Ж',
            'k': 'к', 'K': 'К', 'l': 'л', 'L': 'Л', 'm': 'м', 'M': 'М',
            'n': 'н', 'N': 'Н', 'o': 'о', 'O': 'О', 'p': 'п', 'P': 'П',
            'q': 'қ', 'Q': 'Қ', 'r': 'р', 'R': 'Р', 's': 'с', 'S': 'С',
            't': 'т', 'T': 'Т', 'u': 'у', 'U': 'У', 'v': 'в', 'V': 'В',
            'x': 'х', 'X': 'Х', 'y': 'й', 'Y': 'Й', 'z': 'з', 'Z': 'З',
            "o'": 'ў', "O'": 'Ў', "oʻ": 'ў', "Oʻ": 'Ў',
            "g'": 'ғ', "G'": 'Ғ', "gʻ": 'ғ', "Gʻ": 'Ғ',
            'sh': 'ш', 'Sh': 'Ш', 'SH': 'Ш', 'ch': 'ч', 'Ch': 'Ч', 'CH': 'Ч',
            'yo': 'ё', 'Yo': 'Ё', 'YO': 'Ё', 'yu': 'ю', 'Yu': 'Ю', 'YU': 'Ю',
            'ya': 'я', 'Ya': 'Я', 'YA': 'Я'
        };

        const cyrillicToLatin = {
            'а': 'a', 'А': 'A', 'б': 'b', 'Б': 'B', 'в': 'v', 'В': 'V',
            'г': 'g', 'Г': 'G', 'д': 'd', 'Д': 'D', 'е': 'e', 'Е': 'E',
            'ё': 'yo', 'Ё': 'Yo', 'ж': 'j', 'Ж': 'J', 'з': 'z', 'З': 'Z',
            'и': 'i', 'И': 'I', 'й': 'y', 'Й': 'Y', 'к': 'k', 'К': 'K',
            'л': 'l', 'Л': 'L', 'м': 'm', 'М': 'M', 'н': 'n', 'Н': 'N',
            'о': 'o', 'О': 'O', 'п': 'p', 'П': 'P', 'р': 'r', 'Р': 'R',
            'с': 's', 'С': 'S', 'т': 't', 'Т': 'T', 'у': 'u', 'У': 'U',
            'ф': 'f', 'Ф': 'F', 'х': 'x', 'Х': 'X', 'ц': 'ts', 'Ц': 'Ts',
            'ч': 'ch', 'Ч': 'Ch', 'ш': 'sh', 'Ш': 'Sh', 'ъ': "'", 'Ъ': "'",
            'ь': '', 'Ь': '', 'э': 'e', 'Э': 'E', 'ю': 'yu', 'Ю': 'Yu',
            'я': 'ya', 'Я': 'Ya', 'ў': 'oʻ', 'Ў': 'Oʻ', 'қ': 'q', 'Қ': 'Q',
            'ғ': 'gʻ', 'Ғ': 'Gʻ', 'ҳ': 'h', 'Ҳ': 'H'
        };

        let conversionCount = 0;
        let totalTimeSaved = 0;
        let history = [];

        // Real-time character count
        document.getElementById('inputText').addEventListener('input', function() {
            document.getElementById('charCount').textContent = this.value.length;
        });

        function convertToCyrillic() {
            const startTime = Date.now();
            let text = document.getElementById('inputText').value;
            let result = text;
            
            // Convert combinations first
            for (const [latin, cyrillic] of Object.entries(latinToCyrillic)) {
                if (latin.length > 1) {
                    result = result.replace(new RegExp(latin, 'g'), cyrillic);
                }
            }
            
            // Then single letters
            for (const [latin, cyrillic] of Object.entries(latinToCyrillic)) {
                if (latin.length === 1) {
                    result = result.replace(new RegExp(latin, 'g'), cyrillic);
                }
            }
            
            showResult(result, 'Lotin → Kirill');
            updateStats(startTime);
        }

        function convertToLatin() {
            const startTime = Date.now();
            let text = document.getElementById('inputText').value;
            let result = text;
            
            // Convert combinations first
            for (const [cyrillic, latin] of Object.entries(cyrillicToLatin)) {
                if (latin.length > 1) {
                    result = result.replace(new RegExp(cyrillic, 'g'), latin);
                }
            }
            
            // Then single letters
            for (const [cyrillic, latin] of Object.entries(cyrillicToLatin)) {
                if (latin.length === 1) {
                    result = result.replace(new RegExp(cyrillic, 'g'), latin);
                }
            }
            
            showResult(result, 'Kirill → Lotin');
            updateStats(startTime);
        }

        function showResult(text, type) {
            document.getElementById('result').innerHTML = `<strong>${type}:</strong><br><br>${text}`;
            
            // Add to history
            const historyItem = {
                type: type,
                input: document.getElementById('inputText').value.substring(0, 50),
                output: text.substring(0, 50),
                time: new Date().toLocaleTimeString()
            };
            
            history.unshift(historyItem);
            if (history.length > 5) history.pop();
            
            updateHistory();
        }

        function updateStats(startTime) {
            const timeTaken = Date.now() - startTime;
            conversionCount++;
            totalTimeSaved += 5; // Assume 5 seconds saved per conversion
            
            document.getElementById('conversionCount').textContent = conversionCount;
            document.getElementById('timeSaved').textContent = totalTimeSaved;
        }

        function updateHistory() {
            const historyList = document.getElementById('historyList');
            historyList.innerHTML = '';
            
            history.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <strong>${item.type}</strong><br>
                    <small>${item.time}</small><br>
                    <i>"${item.input}..." → "${item.output}..."</i>
                `;
                historyList.appendChild(div);
            });
        }

        function copyToClipboard() {
            const resultText = document.getElementById('result').textContent;
            navigator.clipboard.writeText(resultText).then(() => {
                const btn = event.target;
                const originalHTML = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i> Nusxalandi!';
                btn.style.background = '#10B981';
                
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                    btn.style.background = '';
                }, 2000);
            });
        }

        // Initialize
        updateHistory();
        document.getElementById('inputText').focus();
    </script>
</body>
</html>
